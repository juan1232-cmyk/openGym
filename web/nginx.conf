# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
#
# Rate limiting: server.js does no throttling of its own (it's a single Node process — every
# request costs it real CPU/disk work), so this is the only thing standing between the API and
# whatever hits it once it's reachable from the internet. Two zones: `auth`, tight, for the
# handful of endpoints a stranger can call without a session at all (registration, login, the
# invite-code check); `api`, looser, for everything else, just to stop generic flooding rather
# than normal use (the app fires several calls in a row on load).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline response headers. No CSP here on purpose -- the built app's script/style
    # sources aren't audited for one yet, and a wrong CSP fails closed (breaks the app)
    # rather than open, so it needs its own pass with the app open in front of you, not a
    # guess shipped alongside everything else here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Ignored by browsers over plain http, so this is safe to always send -- only takes
    # effect once you're actually serving over https (see docs/SELF_HOSTING.md).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Registration/login/invite-code checks — the only endpoints worth guessing against.
    # burst=5 nodelay covers a real person fumbling a passkey prompt and retrying once or
    # twice, without queuing them (nodelay serves the burst immediately instead of spacing it
    # out), while still cutting off anything sustained.
    location ~ ^/api/(register|login)/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → backend container
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}

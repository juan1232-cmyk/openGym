name: Bug report
description: Something looks wrong or a number doesn't add up
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. A screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you using it?
      options:
        - Hosted app (open-gym-lac.vercel.app)
        - Self-hosted (Node)
        - Self-hosted (Docker)
        - Live demo
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18

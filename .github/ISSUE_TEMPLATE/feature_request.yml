name: Idea or feature request
description: Something you'd like openGym to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, the solution second. "I want to X but I can't" is the useful part.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
